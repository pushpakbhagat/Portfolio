# Netlify detects Next.js and adds its Next.js runtime automatically; this only pins the basics.
# Environment variables (Supabase keys etc.) are set in the Netlify UI, never here.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9+.
  NODE_VERSION = "22"
